name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: aether-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: aether
          POSTGRES_USER: sunjin
          POSTGRES_PASSWORD: "192837"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sunjin -d aether" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 校验迁移与打包
        run: |
          set -euo pipefail
          find api/src/main/resources/db/migration/postgresql -maxdepth 1 -type f -printf '%f\n' | grep -vE '^V[0-9]+__[-A-Za-z0-9_]+\.sql$' && exit 1 || true
          mvn -B -ntp package
      - name: 整理发布产物
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; STAGE="stage/release/$TAG"
          mkdir -p "$STAGE/admin/deploy" "$STAGE/front/deploy"
          for c in admin front; do
            jar="$(find "$c/target" -maxdepth 1 -type f -name "$c-*.jar")"
            test "$(printf '%s\n' "$jar" | wc -l)" -eq 1
            cp "$jar" "$STAGE/$c/$c.jar"
            cp "deploy/$c.Dockerfile" "$STAGE/$c/deploy/"
            cp deploy/.dockerignore "$STAGE/$c/.dockerignore"
          done
          cp deploy/release.sh deploy/compose.yml deploy/README.md "$STAGE/admin/deploy/"
      - name: 构建镜像包
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"; STAGE="stage/release/$TAG"
          docker buildx build --load --cache-from type=gha,scope=aether-admin --cache-to type=gha,mode=max -f "$STAGE/admin/deploy/admin.Dockerfile" -t "aether-admin:release-$TAG" "$STAGE/admin"
          docker buildx build --load --cache-from type=gha,scope=aether-front --cache-to type=gha,mode=max -f "$STAGE/front/deploy/front.Dockerfile" -t "aether-front:release-$TAG" "$STAGE/front"
          docker save -o "$STAGE/images.tar" "aether-admin:release-$TAG" "aether-front:release-$TAG"
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?未配置 DEPLOY_HOST}"; : "${DEPLOY_USER:?未配置 DEPLOY_USER}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" 'echo ssh-ok'
      - name: 上传并部署
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/aether-server' }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[A-Za-z0-9_.-]+$ ]]
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)-$TAG"
          DEPLOY_PATH="$DEPLOY_ROOT/aether"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$RELEASE_ID'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH/releases' '$DEPLOY_PATH/.releases/aether.previous'" <<'EOF'
          set -euo pipefail
          releases_dir="$1"; previous_state="$2"
          previous_release="$(sed -n 's/^release_id=//p' "$previous_state" 2>/dev/null || true)"
          if [[ -n "$previous_release" ]]; then
            find "$releases_dir" -type f -name images.tar ! -path "$releases_dir/$previous_release/*" -delete
          else
            mapfile -t archives < <(find "$releases_dir" -type f -name images.tar -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2-)
            if ((${#archives[@]})); then rm -f -- "${archives[@]}"; fi
          fi
          EOF
          RSYNC_SSH="ssh -p ${DEPLOY_PORT:-22} -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120"
          for c in admin front; do rsync -az --delete -e "$RSYNC_SSH" "stage/release/$TAG/$c/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/$c/"; done
          rsync -az -e "$RSYNC_SSH" "stage/release/$TAG/images.tar" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/images.tar"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "docker load -i '$DEPLOY_PATH/releases/$RELEASE_ID/images.tar'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DEPLOY_PATH/releases/$RELEASE_ID/images.tar'"
          ssh -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "AETHER_PREBUILT_IMAGES=true bash '$DEPLOY_PATH/releases/$RELEASE_ID/admin/deploy/release.sh' aether '$TAG' '$DEPLOY_PATH' '$RELEASE_ID'"
