groups:
  - name: aether-platform
    rules:
      - alert: AetherHighHttp5xxRate
        expr: sum(rate(aether_http_requests_count{status=~"5.."}[5m])) / clamp_min(sum(rate(aether_http_requests_count[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Aether HTTP 5xx rate is high
          description: More than 5% of requests returned 5xx for 10 minutes.
      - alert: AetherHighHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(aether_http_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Aether HTTP p95 latency is high
          description: HTTP p95 latency exceeded 2 seconds for 10 minutes.
      - alert: AetherWorkflowDeadLettersGrowing
        expr: aether_workflow_execution_dead_letters > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aether workflow dead letters detected
          description: Workflow execution dead letters increased during the last 15 minutes.
      - alert: AetherRateLimitResponses
        expr: sum(rate(aether_http_requests_count{status="429"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aether rate limiting is active
          description: More than one rate-limited request per second was observed.
      - alert: AetherCallbackDeadLetters
        expr: aether_workflow_callback_dead_letters > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aether callback dead letters detected
          description: Workflow completion callbacks require operational attention.
