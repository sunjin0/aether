# 独立基础服务栈：不包含任何 Aether 应用容器。
# 仅 PostgreSQL 复用旧的 external 数据卷；Redis 与 MinIO 不挂载 Aether 新建的数据卷。
name: aether-infrastructure

services:
  postgres:
    # pgvector_data 中已有 PostgreSQL 18 集群，数据目录位于卷内的 18/docker。
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: aether-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_dev}
      PGDATA: /var/lib/postgresql/data/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aether-services]

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aether-services]

  minio:
    image: minio/minio:latest
    container_name: aether-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [aether-services]

networks:
  aether-services:
    external: true
    name: ${AETHER_SHARED_NETWORK:-aether-services}

volumes:
  postgres-data:
    external: true
    name: ${AETHER_POSTGRES_VOLUME:-pgvector_data}
