apiVersion: v1
kind: Namespace
metadata:
  name: aether-connector-test
  labels:
    app.kubernetes.io/part-of: aether-local-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-sample
  namespace: aether-connector-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connector-sample
  template:
    metadata:
      labels:
        app: connector-sample
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
