spring:
  profiles:
    active: dev
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    placeholder-replacement: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  # 国际化
  messages:
    basename: i18n.api
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: zh_CN
    always-use-message-format: false
server:
  port: 8080
  shutdown: graceful
  connection-timeout: ${SERVER_CONNECTION_TIMEOUT:600000}
  keep-alive-timeout: ${SERVER_KEEPALIVE_TIMEOUT:600000}

spring.lifecycle:
  timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}

# GlobalFilter 写入的 MDC traceId 只用于日志关联，不记录请求体、凭据或 Prompt。
logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

management:
  otlp:
    metrics:
      export:
        enabled: ${AETHER_OTLP_METRICS_ENABLED:false}
        url: ${AETHER_OTLP_METRICS_URL:http://127.0.0.1:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${AETHER_MAIL_HEALTH_ENABLED:false}

aether:
  otel:
    admin:
      enabled: ${AETHER_ADMIN_OTEL_ENABLED:false}
      endpoint: ${AETHER_ADMIN_OTEL_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      service-name: ${AETHER_ADMIN_OTEL_SERVICE_NAME:aether-admin}
      logs-enabled: ${AETHER_ADMIN_OTEL_LOGS_ENABLED:false}
      logs-endpoint: ${AETHER_ADMIN_OTEL_LOGS_ENDPOINT:http://127.0.0.1:4318/v1/logs}
  # 身份集成配置必须由可执行的 Admin 应用加载；api 模块中的同名配置不会覆盖此处。
  identity:
    scim:
      enabled: ${AETHER_SCIM_ENABLED:false}
      base-path: ${AETHER_SCIM_BASE_PATH:/scim/v2}
      bearer-token: ${AETHER_SCIM_BEARER_TOKEN:}
      tenant-id: ${AETHER_SCIM_TENANT_ID:}
    saml:
      enabled: ${AETHER_SAML_ENABLED:false}
      metadata-driven: ${AETHER_SAML_METADATA_DRIVEN:false}
      entity-id: ${AETHER_SAML_ENTITY_ID:}
      metadata-uri: ${AETHER_SAML_METADATA_URI:}
      idp-entity-id: ${AETHER_SAML_IDP_ENTITY_ID:}
      certificate: ${AETHER_SAML_CERTIFICATE:}
      sso-url: ${AETHER_SAML_SSO_URL:}
      redirect-uri: ${AETHER_SAML_REDIRECT_URI:}
    oidc:
      enabled: ${AETHER_OIDC_ENABLED:false}
      issuer-uri: ${AETHER_OIDC_ISSUER_URI:}
      authorization-uri: ${AETHER_OIDC_AUTHORIZATION_URI:}
      token-uri: ${AETHER_OIDC_TOKEN_URI:}
      jwks-uri: ${AETHER_OIDC_JWKS_URI:}
      client-id: ${AETHER_OIDC_CLIENT_ID:}
      client-secret: ${AETHER_OIDC_CLIENT_SECRET:}
      redirect-uri: ${AETHER_OIDC_REDIRECT_URI:}
      auto-provision: ${AETHER_OIDC_AUTO_PROVISION:false}
      scopes: ${AETHER_OIDC_SCOPES:openid,profile,email}

# 文档解析服务（AnyDoc），将其支持的文件转换为 Markdown。
anydoc:
  service:
    url: ${ANYDOC_SERVICE_URL:http://127.0.0.1:8000}
