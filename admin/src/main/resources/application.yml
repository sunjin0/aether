
spring:
  profiles:
    active: dev
  # 国际化
  messages:
    basename: i18n.api
    encoding: UTF-8
    # 默认区域，可以写多个，用逗号分隔
    fallback-to-system-locale: true
    always-use-message-format: false
server:
  port: 8080

# 文档解析服务（Docling），配置后支持 PDF/DOCX 结构化解析及 XLSX 导入
docling:
  service:
    url: http://127.0.0.1:8000
