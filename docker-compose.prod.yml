# 生产环境全栈编排：PostgreSQL、Redis、MinIO、Admin、Front、Dashboard、Deep Agent、MCP 与离线 Sandbox。
#
# 用法：
#   cp .env.prod.example .env.prod     # 填写全部 replace-with-* 占位值
#   ./scripts/fetch-sources.sh         # 用宿主机 git 凭据检出四个源码仓库到 .sources/
#   docker compose --env-file .env.prod -f docker-compose.prod.yml config   # 先校验，缺失密钥会在此报错
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# 相对通用编排的生产加固：
#   1. 密钥一律用 ${VAR:?} 强制要求，缺失即失败，不再回落到 aether_dev 这类已知弱口令；
#   2. PostgreSQL/Redis/MinIO 不发布宿主端口，应用端口仅绑定回环地址，由同宿主的外部网关反代并终止 TLS；
#   3. 全部服务启用日志轮转，避免长期运行撑爆宿主磁盘；
#   4. 启用 Redis 访问密码、关闭未鉴权的 Druid 监控台、禁止容器提权。
#
# 构建上下文：四个应用的源码由 scripts/fetch-sources.sh 用部署机的 git 凭据预先检出到
# AETHER_SOURCE_ROOT（默认 .sources/），本文件只从本地目录构建。不用 BuildKit 的 Git 上下文，
# 因为它读不到宿主机的 git 凭据，私有仓库无法拉取。
#
# 对象存储：生产默认使用阿里云 OSS（STORAGE_PROVIDER=oss）。
# 内置 MinIO 仅作兜底，已放入 minio profile，默认不启动：
#   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile minio up -d
# 启用该 profile 前须把应用侧 STORAGE_PROVIDER 一并改为 minio，并填好 MINIO_* 变量。
# 顶层 name 使卷与网络带 aether-prod_ 前缀，与本地 dev 栈隔离。
#
# 部署前提：必须在专用生产宿主机上运行。container_name 沿用 aether-* 约定，与
# docker-compose.yml / docker-compose.acceptance.yml 完全同名，在同一台机器上与
# 本地栈同时启动会直接冲突（网络与数据卷虽已隔离，容器名不会）。
name: aether-prod

# 统一日志轮转；生产环境必须限制单文件大小与保留份数。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # PostgreSQL 必须使用 pgvector 镜像：V1 迁移会执行 CREATE EXTENSION vector，
  # knowledge_document_chunk.embedding 为 vector(1536)。
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: aether-postgres
    restart: unless-stopped
    logging: *default-logging
    # 不发布宿主端口：仅同网络的容器可访问。
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-1g}
    networks: [aether-services]

  # Redis 仅存会话、权限、限流与分布式锁；丢失时允许冷启动重建，但仍开启 AOF 以减少抖动。
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: aether-redis
    restart: unless-stopped
    logging: *default-logging
    # requirepass 与 Admin/Front 的 SPRING_REDIS_PASSWORD 必须一致。
    # Spring Boot 2.7 的 spring.redis.password 无 yml 占位，但环境变量可绑定（已核实）。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
    mem_limit: ${REDIS_MEM_LIMIT:-768m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-256m}
    networks: [aether-services]

  # 兜底对象存储，默认不启动（需显式 --profile minio）。生产使用阿里云 OSS 时无需本服务。
  # 启用时 API 绑定回环，供外部网关反代到 MINIO_PUBLIC_ENDPOINT（预签名下载链接需浏览器可达）；
  # 管理控制台不暴露。注意：应用侧的 STORAGE_PROVIDER 必须同步改为 minio，否则仍走 OSS。
  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: aether-minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
    environment:
      # 故意不给默认值：compose 会对 profile 内的服务一并插值，若用 :? 会连累默认的 OSS
      # 部署；而留空时 MinIO 会因凭据长度不足拒绝启动——是响亮的失败，不是静默弱口令。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    mem_reservation: ${MINIO_MEM_RESERVATION:-512m}
    networks: [aether-services]

  # Java Admin 是唯一执行 Flyway 迁移的服务（flyway-core 只声明在 admin/pom.xml），
  # 因此必须保持单副本；如需多副本，其余副本设 FLYWAY_ENABLED=false。
  admin:
    image: ${AETHER_ADMIN_IMAGE:-aether-admin:prod}
    build:
      # 构建上下文是部署机上已检出的源码目录，由 scripts/fetch-sources.sh 准备。
      # 不用 BuildKit 的 Git 上下文：它不读宿主机 git 凭据（credential.helper、~/.netrc、
      # SSH 私钥都不生效），私有仓库拉不下来，只能靠 build secret 另配令牌。
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether"
      dockerfile: admin/Dockerfile
    container_name: aether-admin
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    # JVM 需要可写 /tmp；限制大小并禁止执行，降低容器内落盘风险。
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    mem_limit: ${ADMIN_MEM_LIMIT:-1g}
    mem_reservation: ${ADMIN_MEM_RESERVATION:-768m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"
    environment:
      # 三个 application.yml 默认 profile 都是 dev（硬编码 localhost），此处必须显式覆盖。
      SPRING_PROFILES_ACTIVE: prod
      SERVER_SHUTDOWN_TIMEOUT: ${SERVER_SHUTDOWN_TIMEOUT:-30s}
      # 连接与存储
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aether}
      DB_USERNAME: ${DB_USERNAME:-aether}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # 对象存储：生产默认 OSS。OSS_BUCKET 为各业务共用的单一 bucket（按对象键前缀隔离）；
      # 如需分桶，改用下面的 STORAGE_*_BUCKET（优先级高于 OSS_BUCKET）。
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?set OSS_ENDPOINT}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?set OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?set OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET:?set OSS_BUCKET}
      # 这里必须用嵌套默认值，不能写 `:-` 空串。Spring 的 ${VAR:default} 只在变量「缺失」时
      # 才取默认值，空串算有效值，会把 application-prod.yml 里
      # `bucket: ${STORAGE_FILE_BUCKET:${OSS_BUCKET:...}}` 的回退链打断，最终得到空 bucket 名。
      # compose 的 :- 语义相反（空串视作未设），所以在编排层就把回退解析掉。
      STORAGE_FILE_BUCKET: ${STORAGE_FILE_BUCKET:-${OSS_BUCKET}}
      STORAGE_KNOWLEDGE_BUCKET: ${STORAGE_KNOWLEDGE_BUCKET:-${OSS_BUCKET}}
      STORAGE_SKILL_BUCKET: ${STORAGE_SKILL_BUCKET:-${OSS_BUCKET}}
      STORAGE_ARTIFACT_BUCKET: ${STORAGE_ARTIFACT_BUCKET:-${OSS_BUCKET}}
      # 以下 MINIO_* 仅在 --profile minio 模式下使用，默认留空即可。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      # 关闭 prod 下默认开启且无鉴权的 Druid 监控台（/druid/* 会泄露 SQL 统计）。
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_ENABLED: "false"
      SPRING_DATASOURCE_DRUID_WEBSTATFILTER_ENABLED: "false"
      # 覆盖 application-prod.yml 中明文提交的 QQ 邮箱凭据（环境变量优先级高于 profile yml）。
      SPRING_MAIL_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT:-465}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      # 留空时审计载荷明文落库，生产必须配置。
      AGENT_AUDIT_ENCRYPTION_KEY: ${AGENT_AUDIT_ENCRYPTION_KEY:?set AGENT_AUDIT_ENCRYPTION_KEY}
      # 外部服务
      AETHER_DEEP_AGENT_BASE_URL: ${AETHER_DEEP_AGENT_BASE_URL:-http://aether-deep-agent:8010}
      AETHER_DEEP_AGENT_SHARED_SECRET: ${AETHER_DEEP_AGENT_SHARED_SECRET:?set AETHER_DEEP_AGENT_SHARED_SECRET}
      AETHER_DEEP_AGENT_KEY_ID: ${AETHER_DEEP_AGENT_KEY_ID:-deep-agent-v1}
      AETHER_DEEP_AGENT_RUN_TIMEOUT_SECONDS: ${AETHER_DEEP_AGENT_RUN_TIMEOUT_SECONDS:-600}
      # 须与 MCP 容器的 AETHER_MCP_DELEGATION_SECRET / AETHER_MCP_CREDENTIAL_SECRET 一致。
      AETHER_MCP_DELEGATION_SECRET: ${AETHER_MCP_DELEGATION_SECRET:?set AETHER_MCP_DELEGATION_SECRET}
      AETHER_MCP_CREDENTIAL_SECRET: ${AETHER_MCP_CREDENTIAL_SECRET:?set AETHER_MCP_CREDENTIAL_SECRET}
      ANYDOC_SERVICE_URL: ${ANYDOC_SERVICE_URL:-http://aether-mcp:8000}
      AETHER_SANDBOX_RUNNER_TOKEN: ${AETHER_SANDBOX_RUNNER_TOKEN:?set AETHER_SANDBOX_RUNNER_TOKEN}
      AETHER_SERVICE_ACCOUNT_ACCESS_TOKEN_SECONDS: ${AETHER_SERVICE_ACCOUNT_ACCESS_TOKEN_SECONDS:-900}
      # 工作流回调与 HTTP 节点默认拒绝全部目标；启用时须同时配置允许主机与签名密钥。
      AETHER_WORKFLOW_CALLBACK_ENABLED: ${AETHER_WORKFLOW_CALLBACK_ENABLED:-false}
      AETHER_WORKFLOW_CALLBACK_ALLOWED_HOSTS: ${AETHER_WORKFLOW_CALLBACK_ALLOWED_HOSTS:-}
      AETHER_WORKFLOW_CALLBACK_SIGNING_SECRET: ${AETHER_WORKFLOW_CALLBACK_SIGNING_SECRET:-}
      AETHER_WORKFLOW_HTTP_ALLOWED_HOSTS: ${AETHER_WORKFLOW_HTTP_ALLOWED_HOSTS:-}
    networks:
      aether-services:
        aliases: [aether-admin]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # 不依赖 minio：默认 OSS 模式下该服务不在 profile 内，声明依赖会导致启动失败。

  # front 的 classpath 没有 Flyway（只有 spring.flyway.* 属性），必须等 admin 迁移完成后再启动。
  front:
    image: ${AETHER_FRONT_IMAGE:-aether-front:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether"
      dockerfile: front/Dockerfile
    container_name: aether-front
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    mem_limit: ${FRONT_MEM_LIMIT:-1g}
    mem_reservation: ${FRONT_MEM_RESERVATION:-768m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONT_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_SHUTDOWN_TIMEOUT: ${SERVER_SHUTDOWN_TIMEOUT:-30s}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aether}
      DB_USERNAME: ${DB_USERNAME:-aether}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # 对象存储配置与 admin 保持一致，见 admin 服务的注释。
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?set OSS_ENDPOINT}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?set OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?set OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET:?set OSS_BUCKET}
      # 同 admin：留空时在编排层回退到 OSS_BUCKET，不下发空串。
      STORAGE_FILE_BUCKET: ${STORAGE_FILE_BUCKET:-${OSS_BUCKET}}
      STORAGE_KNOWLEDGE_BUCKET: ${STORAGE_KNOWLEDGE_BUCKET:-${OSS_BUCKET}}
      STORAGE_SKILL_BUCKET: ${STORAGE_SKILL_BUCKET:-${OSS_BUCKET}}
      STORAGE_ARTIFACT_BUCKET: ${STORAGE_ARTIFACT_BUCKET:-${OSS_BUCKET}}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_ENABLED: "false"
      SPRING_DATASOURCE_DRUID_WEBSTATFILTER_ENABLED: "false"
      SPRING_MAIL_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT:-465}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      AETHER_DEEP_AGENT_BASE_URL: ${AETHER_DEEP_AGENT_BASE_URL:-http://aether-deep-agent:8010}
      AETHER_DEEP_AGENT_SHARED_SECRET: ${AETHER_DEEP_AGENT_SHARED_SECRET:?set AETHER_DEEP_AGENT_SHARED_SECRET}
      AETHER_MCP_DELEGATION_SECRET: ${AETHER_MCP_DELEGATION_SECRET:?set AETHER_MCP_DELEGATION_SECRET}
      AETHER_MCP_CREDENTIAL_SECRET: ${AETHER_MCP_CREDENTIAL_SECRET:?set AETHER_MCP_CREDENTIAL_SECRET}
    networks:
      aether-services:
        aliases: [aether-front]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      admin: { condition: service_healthy }

  # Python Deep Agent；模型凭据只在本服务与 MCP 使用，Java 侧从数据库读取 ModelProvider。
  deep-agent:
    image: ${AETHER_DEEP_AGENT_IMAGE:-aether-deep-agent:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-deep-agent-service"
    container_name: aether-deep-agent
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 12
    mem_limit: ${DEEP_AGENT_MEM_LIMIT:-1g}
    mem_reservation: ${DEEP_AGENT_MEM_RESERVATION:-512m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${AETHER_DEEP_AGENT_PORT:-8010}:8010"
    environment:
      AETHER_DEEP_AGENT_SHARED_SECRET: ${AETHER_DEEP_AGENT_SHARED_SECRET:?set AETHER_DEEP_AGENT_SHARED_SECRET}
      AETHER_DEEP_AGENT_CALLBACK_BASE_URL: ${AETHER_DEEP_AGENT_CALLBACK_BASE_URL:-http://aether-admin:8080}
      AETHER_DEEP_AGENT_MCP_URL: ${AETHER_DEEP_AGENT_MCP_URL:-http://aether-mcp:8000/mcp}
      AETHER_DEEP_AGENT_MODEL: ${AETHER_DEEP_AGENT_MODEL:-openai:gpt-4.1-mini}
      # 密码若含 @ : / 等字符需 URL 编码，否则 DSN 解析失败。
      AETHER_DEEP_AGENT_DATABASE_URL: ${AETHER_DEEP_AGENT_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aether}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    networks:
      aether-services:
        aliases: [aether-deep-agent]
    depends_on:
      postgres: { condition: service_healthy }
      admin: { condition: service_healthy }
      mcp: { condition: service_healthy }

  # MCP 文档解析与工具服务；镜像较大，首次启动会下载 Hugging Face 模型。
  mcp:
    image: ${AETHER_MCP_IMAGE:-aether-mcp:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-mcp-server"
    container_name: aether-mcp
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    cpus: "${AETHER_MCP_CPU_LIMIT:-2.0}"
    command: ["http", "--auth", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12
    mem_limit: ${MCP_MEM_LIMIT:-3g}
    mem_reservation: ${MCP_MEM_RESERVATION:-1g}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      AETHER_MCP_DELEGATION_SECRET: ${AETHER_MCP_DELEGATION_SECRET:?set AETHER_MCP_DELEGATION_SECRET}
      AETHER_MCP_CREDENTIAL_SECRET: ${AETHER_MCP_CREDENTIAL_SECRET:?set AETHER_MCP_CREDENTIAL_SECRET}
      AETHER_ADMIN_INTERNAL_URL: ${AETHER_ADMIN_INTERNAL_URL:-http://aether-admin:8080}
      AETHER_VISION_API_BASE_URL: ${AETHER_VISION_API_BASE_URL:-}
      AETHER_VISION_MODEL: ${AETHER_VISION_MODEL:-}
      AETHER_VISION_API_KEY: ${AETHER_VISION_API_KEY:-}
      # 文档解析默认串行，避免大文件占满宿主 CPU。
      AETHER_DOCUMENT_MAX_CONCURRENCY: ${AETHER_DOCUMENT_MAX_CONCURRENCY:-1}
      AETHER_OCR_DESKEW: ${AETHER_OCR_DESKEW:-false}
      OMP_THREAD_LIMIT: ${OMP_THREAD_LIMIT:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    volumes:
      - mcp-huggingface-cache:/root/.cache/huggingface
      - mcp-docling-cache:/root/.cache/docling
    networks:
      aether-services:
        aliases: [aether-mcp]

  # 全栈中唯一挂载 Docker Socket 的服务，负责领取冻结任务并启动无网络的任务容器。
  # 不得与其他服务共享该 Socket，且应部署在专用宿主机上。
  sandbox-runner:
    image: ${AETHER_SANDBOX_RUNNER_IMAGE:-aether-sandbox-runner:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-mcp-server"
      dockerfile: sandbox-runner/Dockerfile
    container_name: aether-sandbox-runner
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    environment:
      AETHER_ADMIN_INTERNAL_URL: ${AETHER_ADMIN_INTERNAL_URL:-http://aether-admin:8080}
      AETHER_SANDBOX_RUNNER_TOKEN: ${AETHER_SANDBOX_RUNNER_TOKEN:?set AETHER_SANDBOX_RUNNER_TOKEN}
      AETHER_SANDBOX_RUNNER_ID: ${AETHER_SANDBOX_RUNNER_ID:-sandbox-prod-1}
      AETHER_SANDBOX_PYTHON_IMAGE: ${AETHER_SANDBOX_PYTHON_IMAGE:-aether-sandbox-python:prod}
      AETHER_SANDBOX_NODE_IMAGE: ${AETHER_SANDBOX_NODE_IMAGE:-aether-sandbox-node:prod}
      # 留空表示不校验摘要；生产建议填入固定运行时镜像的 sha256 摘要。
      AETHER_SANDBOX_ALLOWED_IMAGE_DIGESTS: ${AETHER_SANDBOX_ALLOWED_IMAGE_DIGESTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      admin: { condition: service_started }
      sandbox-runtime-python: { condition: service_completed_successfully }
      sandbox-runtime-node: { condition: service_completed_successfully }
    networks: [aether-services]

  # 以下两个服务不常驻运行，仅用于构建出 Runner 引用的固定标记运行时镜像。
  sandbox-runtime-python:
    image: ${AETHER_SANDBOX_PYTHON_IMAGE:-aether-sandbox-python:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-mcp-server"
      dockerfile: sandbox-runtime/python.Dockerfile
    command: ["true"]
    networks: [aether-services]

  sandbox-runtime-node:
    image: ${AETHER_SANDBOX_NODE_IMAGE:-aether-sandbox-node:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-mcp-server"
      dockerfile: sandbox-runtime/node.Dockerfile
    command: ["true"]
    networks: [aether-services]

  # React + Nginx 管理台；反向代理到 Admin 的内部地址。
  dashboard:
    image: ${AETHER_DASHBOARD_IMAGE:-aether-dashboard:prod}
    build:
      context: "${AETHER_SOURCE_ROOT:-.sources}/aether-dashboard"
      dockerfile: Dockerfile
    container_name: aether-dashboard
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    mem_limit: ${DASHBOARD_MEM_LIMIT:-256m}
    mem_reservation: ${DASHBOARD_MEM_RESERVATION:-128m}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8001}:80"
    environment:
      AETHER_ADMIN_UPSTREAM: ${AETHER_ADMIN_UPSTREAM:-http://aether-admin:8080}
    networks:
      aether-services:
        aliases: [aether-dashboard]
    depends_on:
      admin: { condition: service_healthy }

networks:
  # 由本 Compose 创建；外部网关容器需加入该网络才能按服务名反代。
  aether-services:
    name: ${AETHER_SHARED_NETWORK:-aether-prod-services}

volumes:
  # PostgreSQL 数据卷；灾备恢复的第一顺位。
  postgres-data:
  # Redis AOF 持久化卷。
  redis-data:
  # 兜底 MinIO 的数据卷；仅在 --profile minio 时使用。使用阿里云 OSS 时对象由云侧负责持久化与备份。
  minio-data:
  # MCP 下载的模型缓存，避免镜像重建后重复下载。
  mcp-huggingface-cache:
  # MCP 文档解析器缓存。
  mcp-docling-cache:
