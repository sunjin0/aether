spring:
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration/postgresql
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aether}
    user: ${DB_USERNAME:sunjin}
    password: ${DB_PASSWORD:192837}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aether}
    username: ${DB_USERNAME:sunjin}
    password: ${DB_PASSWORD:192837}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # druid 下面为连接池的补充设置，应用到上面所有数据源中
      # druid 初始化连接数大小，最小，最大
      initial-size: 10
      min-idle: 8
      max-active: 30
      # druid 配置获取连接等待超时的时间
      max-wait: 30000
      # druid 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # druid 验证数据库连接的有效性
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # druid 打开PSCache，并且指定每个连接上PSCache的大小
      pool-prepared-statements: true
      max-open-prepared-statements: 20
      max-pool-prepared-statement-per-connection-size: 20
      # druid 配置监控统计拦截的filters，去掉后监控界面sql无法统计，wall用于防火墙
      filters: stat,wall,slf4j
      # druid 状态监控
      filter.stat.enabled: true
      filter.stat.db-type: postgresql
      filter.stat.log-slow-sql: true
      filter.stat.slow-sql-millis: 2000
      # druid 监控过滤器
      web-stat-filter.enabled: true
      web-stat-filter.exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # druid 监控页面
      stat-view-servlet.enabled: true
      stat-view-servlet.url-pattern: /druid/*

  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mail:
