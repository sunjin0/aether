    password: hktkjcebzjrfdhjj
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory #SSL连接配置

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  file:
    bucket: ${MINIO_FILE_BUCKET:aether}
    max-size: ${FILE_MAX_SIZE:52428800}

aether:
  deep-agent:
    base-url: ${AETHER_DEEP_AGENT_BASE_URL:}
    shared-secret: ${AETHER_DEEP_AGENT_SHARED_SECRET:}
    key-id: ${AETHER_DEEP_AGENT_KEY_ID:deep-agent-v1}
    mcp-delegation-secret: ${AETHER_MCP_DELEGATION_SECRET:}
    run-timeout-seconds: ${AETHER_DEEP_AGENT_RUN_TIMEOUT_SECONDS:600}

# 查询重写会额外触发一次同步模型调用；生产环境默认关闭以缩短首字响应时间。
agent:
  chat:
    query-rewrite:
      enabled: ${AGENT_CHAT_QUERY_REWRITE_ENABLED:false}

#    mybatis
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
logging:
  level:
    com.sun: trace
knife4j:
  enable: true
  production: false
