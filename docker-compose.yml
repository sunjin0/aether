services:
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: aether-admin
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    mem_reservation: 768m
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Spring Boot 2.x 使用 spring.redis.*，容器内须通过服务名访问 Redis
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aether}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: 6379
      DB_USERNAME: ${DB_USERNAME:-sunjin}
      DB_PASSWORD: ${DB_PASSWORD:-192837}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_KNOWLEDGE_BUCKET: ${MINIO_KNOWLEDGE_BUCKET:-aether-knowledge}
      MINIO_FILE_BUCKET: ${MINIO_FILE_BUCKET:-aether}
      AETHER_DEEP_AGENT_BASE_URL: ${AETHER_DEEP_AGENT_BASE_URL:-http://aether-deep-agent:8010}
      AETHER_DEEP_AGENT_SHARED_SECRET: ${AETHER_DEEP_AGENT_SHARED_SECRET:-aether-deep-agent-dev-secret-change-me}
      # Java 服务签发 MCP 委派 JWT 的密钥；需与 MCP 容器的 AETHER_MCP_DELEGATION_SECRET 保持一致。
      AETHER_DEEP_AGENT_MCP_DELEGATION_SECRET: ${AETHER_MCP_DELEGATION_SECRET:-aether-mcp-delegation-dev-secret-change-me}
      # 必须与 MCP 的 AETHER_MCP_CREDENTIAL_SECRET 一致，用于签发调用方 SMTP 临时凭据令牌。
      AETHER_DEEP_AGENT_MCP_CREDENTIAL_SECRET: ${AETHER_MCP_CREDENTIAL_SECRET:-aether-mcp-credential-dev-secret-change-me}
      # 独立 Sandbox Runner 领取冻结任务的服务凭据。
      AETHER_SANDBOX_RUNNER_TOKEN: ${AETHER_SANDBOX_RUNNER_TOKEN:-aether-sandbox-runner-dev-secret-change-me}
      # OIDC 默认关闭；本地 Keycloak 联调时由运行环境显式启用并注入客户端配置。
      AETHER_OIDC_ENABLED: ${AETHER_OIDC_ENABLED:-false}
      AETHER_OIDC_ISSUER_URI: ${AETHER_OIDC_ISSUER_URI:-}
      AETHER_OIDC_AUTHORIZATION_URI: ${AETHER_OIDC_AUTHORIZATION_URI:-}
      AETHER_OIDC_TOKEN_URI: ${AETHER_OIDC_TOKEN_URI:-}
      AETHER_OIDC_JWKS_URI: ${AETHER_OIDC_JWKS_URI:-}
      AETHER_OIDC_CLIENT_ID: ${AETHER_OIDC_CLIENT_ID:-}
      AETHER_OIDC_CLIENT_SECRET: ${AETHER_OIDC_CLIENT_SECRET:-}
      AETHER_OIDC_REDIRECT_URI: ${AETHER_OIDC_REDIRECT_URI:-}
      AETHER_OIDC_AUTO_PROVISION: ${AETHER_OIDC_AUTO_PROVISION:-false}
      AETHER_OIDC_SCOPES: ${AETHER_OIDC_SCOPES:-openid,profile,email}
      # OpenTelemetry 默认关闭；本地或生产环境显式配置 Collector 后才导出低基数 Trace/日志。
      AETHER_ADMIN_OTEL_ENABLED: ${AETHER_ADMIN_OTEL_ENABLED:-false}
      AETHER_ADMIN_OTEL_ENDPOINT: ${AETHER_ADMIN_OTEL_ENDPOINT:-http://127.0.0.1:4318/v1/traces}
      AETHER_ADMIN_OTEL_SERVICE_NAME: ${AETHER_ADMIN_OTEL_SERVICE_NAME:-aether-admin}
      AETHER_ADMIN_OTEL_LOGS_ENABLED: ${AETHER_ADMIN_OTEL_LOGS_ENABLED:-false}
      AETHER_ADMIN_OTEL_LOGS_ENDPOINT: ${AETHER_ADMIN_OTEL_LOGS_ENDPOINT:-http://127.0.0.1:4318/v1/logs}
      ANYDOC_SERVICE_URL: ${ANYDOC_SERVICE_URL:-http://aether-mcp:8000}
    networks:
      aether-services:
        aliases:
          - aether-admin

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: aether-front
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    mem_reservation: 768m
    ports:
      - "${FRONT_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_SHUTDOWN_TIMEOUT: ${SERVER_SHUTDOWN_TIMEOUT:-30s}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: 6379
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aether}
      DB_USERNAME: ${DB_USERNAME:-sunjin}
      DB_PASSWORD: ${DB_PASSWORD:-192837}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_KNOWLEDGE_BUCKET: ${MINIO_KNOWLEDGE_BUCKET:-aether-knowledge}
      MINIO_FILE_BUCKET: ${MINIO_FILE_BUCKET:-aether}
      AETHER_DEEP_AGENT_BASE_URL: ${AETHER_DEEP_AGENT_BASE_URL:-http://aether-deep-agent:8010}
      AETHER_DEEP_AGENT_SHARED_SECRET: ${AETHER_DEEP_AGENT_SHARED_SECRET:-aether-deep-agent-dev-secret-change-me}
      AETHER_DEEP_AGENT_MCP_DELEGATION_SECRET: ${AETHER_MCP_DELEGATION_SECRET:-aether-mcp-delegation-dev-secret-change-me}
    networks:
      aether-services:
        aliases:
          - aether-front

networks:
  aether-services:
    external: true
    name: ${AETHER_SHARED_NETWORK:-aether-mcp-server_default}
