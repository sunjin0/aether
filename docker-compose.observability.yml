services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector-config.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      default:
      aether-services:
        aliases:
          - otel-collector
    ports: ["4317:4317", "4318:4318", "9464:9464", "13133:13133"]
    stop_grace_period: 30s
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      otel-collector: { condition: service_started }
    stop_grace_period: 30s
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
    stop_grace_period: 30s

volumes:
  grafana-data:

networks:
  aether-services:
    external: true
    name: ${AETHER_SHARED_NETWORK:-aether-services}
